<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260">
  <defs>
    <linearGradient id="wRingA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6A4F1B"/>
      <stop offset="50%" stop-color="#B8913A"/>
      <stop offset="100%" stop-color="#E6CE85"/>
    </linearGradient>
    <linearGradient id="wRingB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#08301C"/>
      <stop offset="60%" stop-color="#1B6B43"/>
      <stop offset="100%" stop-color="#4EA766"/>
    </linearGradient>
    <filter id="wSoft3d" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="0" dy="3" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Mark (left) -->
  <g transform="translate(30,30)">
    <circle cx="100" cy="100" r="82" fill="none" stroke="url(#wRingB)" stroke-width="12" filter="url(#wSoft3d)" />
    <circle cx="100" cy="100" r="68" fill="none" stroke="url(#wRingB)" stroke-width="3" opacity="0.75" />
    <path d="M 34 100 A 66 66 0 0 1 166 100" fill="none" stroke="url(#wRingA)" stroke-width="4" stroke-linecap="round" />
    <g transform="translate(100,100)">
      <path d="M -14 -56 L -14 48 C -14 58 -8 64 4 64 C 16 64 22 58 22 48 L 22 -56 Z" fill="url(#wRingB)" />
      <path d="M -22 -56 L -22 -66 C -22 -72 -16 -74 -6 -74 C 6 -74 14 -72 14 -66 L 14 -56 Z" fill="url(#wRingB)" />
      <path d="M -14 -34 L 32 -34 C 42 -34 46 -30 46 -22 C 46 -14 40 -10 32 -10 L -14 -10 Z" fill="url(#wRingB)" />
      <path d="M -14 -4 L 20 -4 C 28 -4 32 0 32 6 C 32 14 26 18 20 18 L -14 18 Z" fill="url(#wRingB)" />
      <rect x="-11" y="-54" width="4" height="100" fill="url(#wRingA)" opacity="0.9" />
    </g>
  </g>

  <!-- Wordmark (right) -->
  <g transform="translate(240,90)" fill="#0F1410">
    <text font-family="Playfair Display, Georgia, serif" font-weight="500" font-size="64" letter-spacing="0.03em">Fabulous</text>
    <text x="6" y="70" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="38" letter-spacing="0.3em" fill="#0F4A2D">CARTZ</text>
  </g>
</svg>
