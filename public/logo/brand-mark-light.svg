<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fabulous Cartz — Interlocked FC seal (light theme) -->
  <defs>
    <linearGradient id="goldL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6914"/>
      <stop offset="0.5" stop-color="#D4B156"/>
      <stop offset="1" stop-color="#B8913A"/>
    </linearGradient>
    <linearGradient id="emeraldL" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1B6B43"/>
      <stop offset="1" stop-color="#0C3D24"/>
    </linearGradient>
    <linearGradient id="sheenL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.58" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sealClip"><circle cx="32" cy="32" r="29"/></clipPath>
  </defs>

  <!-- Medallion — double hairline seal -->
  <circle cx="32" cy="32" r="29" stroke="url(#goldL)" stroke-width="1.7"/>
  <circle cx="32" cy="32" r="26" stroke="url(#goldL)" stroke-width="0.7" opacity="0.55"/>

  <!-- Crescent C — bold left body, open mouth right -->
  <path d="M42.9 16.4 A19 19 0 1 0 42.9 47.6 L39.7 43.1 A13.5 13.5 0 1 1 39.7 20.9 Z"
        fill="url(#emeraldL)"/>

  <!-- Calligraphic F — interlocks into the C mouth -->
  <g fill="url(#goldL)">
    <!-- stem with slab serifs -->
    <path d="M29.2 18 H33.2 V46 H29.2 Z"/>
    <path d="M27.4 18 H34.9 V20.3 H27.4 Z"/>
    <path d="M27.4 43.7 H34.9 V46 H27.4 Z"/>
    <!-- top arm, curled terminal -->
    <path d="M33.2 18 H44.6 C46.4 18 47.3 19 47.3 21.2 V23.6 H45.2 V21.8 C45.2 20.9 44.7 20.4 43.8 20.4 H33.2 Z"/>
    <!-- middle arm reaching into the C opening -->
    <path d="M33.2 29 H41.2 C42.2 29 42.9 29.7 42.9 31 C42.9 32.3 42.2 33 41.2 33 H33.2 Z"/>
  </g>

  <!-- Diamond riding the seal base -->
  <path d="M32 57.2 l3 3 -3 3 -3 -3 Z" fill="url(#goldL)"/>

  <!-- Sheen sweep -->
  <g clip-path="url(#sealClip)">
    <rect x="-30" y="0" width="30" height="64" fill="url(#sheenL)" opacity="0">
      <animate attributeName="x" values="-30;70" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
