# /backoffice + /backoffice/api on fabulous.fospe.com
# Terminate TLS here (or upstream) and forward both prefixes to the single
# Fastify process on :4000. The storefront keeps its own upstream at `/`.
#
#   nginx -t && systemctl reload nginx

upstream fabulous_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream fabulous_storefront {
    server 127.0.0.1:5173;
    keepalive 32;
}

server {
    listen 80;
    server_name fabulous.fospe.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fabulous.fospe.com;

    ssl_certificate     /etc/letsencrypt/live/fabulous.fospe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fabulous.fospe.com/privkey.pem;

    client_max_body_size 12m;

    # API first so /backoffice/api never falls through to the SPA fallback.
    location /backoffice/api/ {
        proxy_pass http://fabulous_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Console assets + SPA deep links (served by the backend).
    location /backoffice {
        proxy_pass http://fabulous_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Health/readiness for uptime checks.
    location = /health   { proxy_pass http://fabulous_api; }
    location = /ready    { proxy_pass http://fabulous_api; }

    # API documentation (restrict if the deployment is private).
    location /docs       { proxy_pass http://fabulous_api; }

    # The legacy API prefix stays alive for existing clients.
    location /api/       { proxy_pass http://fabulous_api; }

    # Storefront unchanged at the root.
    location / {
        proxy_pass http://fabulous_storefront;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
